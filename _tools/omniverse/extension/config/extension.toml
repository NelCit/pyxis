# omni.hydra.pyxis — RFC 0007. The Pyxis Hydra render-delegate Kit extension.
#
# This extension carries NO compiled C++ (RFC 0007). It ships the prebuilt
# delegate pyxis_hydra.dll (+ its runtime deps + plugInfo), built in build/dev by
# _tools/omniverse/build.ps1, plus pure-Python glue (omni/hydra/pyxis/__init__.py)
# that, on startup: registers the delegate's plugInfo with USD's PlugRegistry
# (Plug.Registry().RegisterPlugins — replaces the former native Carbonite IExt),
# switches omni.hydra.pxr to Pyxis via set_hd_engine, and adds the Pyxis section
# to the Render Settings window. "Pyxis" then appears in the Kit viewport's
# renderer menu.

[package]
title = "Pyxis Hydra"
version = "0.1.0"
description = "Pyxis real-time path tracer (NVRHI/Vulkan) as a Hydra render delegate."
category = "Rendering"
keywords = ["hydra", "render", "delegate", "pyxis", "pathtracer"]
authors = ["Pyxis"]

# USD must be loaded before we register a USD plugin. omni.usd.libs brings the
# nv-usd runtime libs into the process; omni.usd gives the Python Plug binding the
# __init__.py uses to call Plug.Registry().RegisterPlugins. A viewport app
# additionally pulls the Hydra-engine/viewport extensions that surface the
# renderer dropdown; we don't hard-depend on those so the extension also loads in
# a bare kit.exe for registration smoke-testing (the module guards those imports).
[dependencies]
"omni.usd.libs" = {}
"omni.usd" = {}
# omni.hydra.pxr is NVIDIA's "Pixar Hydra" Kit viewport engine. It registers the
# Kit hydra-engine factory for the `pxr` renderer slot and drives ANY registered
# USD HdRendererPlugin — including ours. With it loaded, "Pyxis" becomes a real,
# selectable entry in the viewport's Render menu (RFC 0004 Option B, unblocked:
# we don't implement the closed IHydraEngineFactory — omni.hydra.pxr does).
"omni.hydra.pxr" = {}

# omni.kit.viewport.utility (optional) — the startup Python module uses it to set
# Pyxis as the active viewport render delegate at launch. Optional so the
# extension still loads in a bare kit.exe (registration smoke test) without the
# viewport stack; the module guards the import.
"omni.kit.viewport.utility" = { optional = true }

# omni.rtx.window.settings hosts the Render Settings window + the
# RendererSettingsFactory the Python startup module uses to add the "Pyxis"
# section (alongside RTX). Same dependency AVxcelerate's avx.ap.lpe.settings
# declares. The module guards the import so a bare kit.exe still loads.
"omni.rtx.window.settings" = {}

# Python startup module (RFC 0007). On startup it registers the delegate's
# plugInfo with USD's PlugRegistry (replaces the former native Carbonite IExt),
# then forces the pxr engine to actually load the Pyxis delegate (the pxr engine
# otherwise starts on Storm even when /pxr/rendermode says Pyxis). See
# omni/hydra/pyxis/__init__.py.
[[python.module]]
name = "omni.hydra.pyxis"

[settings]
# Nothing yet; RenderSettings (§21) surface lands with the full delegate.
