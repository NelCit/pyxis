# omni.hydra.pyxis — RFC 0004. The Pyxis Hydra render-delegate Kit extension.
#
# This extension is Python-free. It ships a PREBUILT native delegate
# (pyxis_hydra_omni.dll, compiled out-of-tree by _tools/omniverse/build.ps1
# against nv-usd 25.11) plus a tiny native Carbonite IExt
# (omni.hydra.pyxis.plugin.dll) that registers the delegate's plugInfo with
# USD's PlugRegistry on startup, so "Pyxis" appears in the Kit viewport's
# Hydra-engine / renderer enumeration.

[package]
title = "Pyxis Hydra"
version = "0.1.0"
description = "Pyxis real-time path tracer (NVRHI/Vulkan) as a Hydra render delegate."
category = "Rendering"
keywords = ["hydra", "render", "delegate", "pyxis", "pathtracer"]
authors = ["Pyxis"]

# USD must be loaded before we register a USD plugin. omni.usd.libs brings the
# nv-usd runtime libs into the process (our native plugin links Plug/Tf import
# libs, resolved at load by these DLLs). A viewport app additionally pulls the
# Hydra-engine/viewport extensions that surface the renderer dropdown; we don't
# depend on those here so the extension also loads in a bare kit.exe for
# registration smoke-testing.
[dependencies]
"omni.usd.libs" = {}
# omni.hydra.pxr is NVIDIA's "Pixar Hydra" Kit viewport engine. It registers the
# Kit hydra-engine factory for the `pxr` renderer slot and drives ANY registered
# USD HdRendererPlugin — including ours. With it loaded, "Pyxis" becomes a real,
# selectable entry in the viewport's Render menu (RFC 0004 Option B, unblocked:
# we don't implement the closed IHydraEngineFactory — omni.hydra.pxr does).
"omni.hydra.pxr" = {}

# omni.kit.viewport.utility (optional) — the startup Python module uses it to set
# Pyxis as the active viewport render delegate at launch. Optional so the
# extension still loads in a bare kit.exe (registration smoke test) without the
# viewport stack; the module guards the import.
"omni.kit.viewport.utility" = { optional = true }

# omni.rtx.window.settings hosts the Render Settings window + the
# RendererSettingsFactory the Python startup module uses to add the "Pyxis"
# section (alongside RTX). Same dependency AVxcelerate's avx.ap.lpe.settings
# declares. The module guards the import so a bare kit.exe still loads.
"omni.rtx.window.settings" = {}

# Native Carbonite IExt that performs the PlugRegistry registration on startup.
# Kit's loader globs `*.plugin` and appends the platform extension ->
# bin/omni.hydra.pyxis.plugin.dll.
[[native.plugin]]
path = "bin/*.plugin"
recursive = false

# Python startup module (RFC 0006) — forces the pxr engine to actually load the
# Pyxis delegate at launch (the pxr engine otherwise starts on Storm even when
# /pxr/rendermode says Pyxis). See omni/hydra/pyxis/__init__.py.
[[python.module]]
name = "omni.hydra.pyxis"

[settings]
# Nothing yet; RenderSettings (§21) surface lands with the full delegate.
